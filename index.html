<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ff-1204</title>
<meta name="description" content="도리의 정원 — 꽃을 기르고, 꽃잎을 말려, 차로 우리는 작은 정원 게임">
<style>
  :root { --bg: #f6f1e7; --panel: #fffaf0; --ink: #3b3128; --muted: #8a7a68; --accent: #5f8a4e; --line: #e2d7c3; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1f1b17; --panel: #2a241f; --ink: #efe6d6; --muted: #a8998a; --accent: #8fbf74; --line: #3d342c; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink); font: 16px/1.6 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  main { width: 100%; max-width: 420px; text-align: center; }
  .card { display: block; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; color: inherit; text-decoration: none; }
  .card img { display: block; width: 100%; height: auto; image-rendering: pixelated; border-bottom: 1px solid var(--line); }
  .card div { padding: 16px 18px 18px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p { margin: 0; color: var(--muted); }
  .go { display: inline-block; margin-top: 14px; padding: 8px 18px; border-radius: 999px; background: var(--accent); color: #fff; font-weight: 700; }
  footer { margin-top: 18px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <a class="card" href="https://ff-1204.github.io/doris-garden/">
    <img src="https://ff-1204.github.io/doris-garden/og.png" alt="도리의 정원">
    <div>
      <h1>🌱 도리의 정원</h1>
      <p>꽃을 기르고, 꽃잎을 말려, 차로 우려요.<br>천천히 돌보는 작은 정원 게임이에요.</p>
      <span class="go">정원 가기</span>
    </div>
  </a>
  <footer>ff-1204</footer>
</main>
</body>
</html>
